<aside class="sidebar">
    <div class="sidebar-top">
        <a routerLink="/home" class="brand" aria-label="ホームへ">
            <span class="brand-icon">社保</span>
            <span class="brand-text">
                <span class="brand-title">社会保険管理</span>
                <span class="brand-sub">Labor &amp; Insurance</span>
            </span>
        </a>

        <nav class="nav" aria-label="メインメニュー">
            @for (item of navItems; track item.route) {
                <a
                    class="nav-link"
                    [routerLink]="item.route"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
                >
                    <span class="nav-icon">{{ item.icon }}</span>
                    <span class="nav-label">{{ item.label }}</span>
                </a>
            }
        </nav>
    </div>

    <div class="sidebar-bottom">
        <a routerLink="/profile" class="user-card" routerLinkActive="active">
            <span class="user-avatar">{{ userInitial() }}</span>
            <span class="user-info">
                <span class="user-name">{{ userDisplayName() }}</span>
                <span class="user-role">{{ roleLabel(currentUser?.role) }}</span>
            </span>
            <span class="user-chevron" aria-hidden="true">›</span>
        </a>

        <button type="button" class="logout-btn" (click)="onLogout()">
            ログアウト
        </button>
    </div>
</aside>

<style>

        background: #f8fafc;
    }

        flex-shrink: 0;
    }

        gap: 2px;

    }

    .brand-title {

        font-weight: 700;
        color: #111827;

    }

    .brand-sub {

    .nav {

        padding: 0 4px;
    }

    .nav-link {
        display: flex;

        color: #4b5563;
