@if (dialog(); as state) {
    <div class="confirm-backdrop" (click)="onBackdropClick($event)">
        <div
            class="confirm-dialog"
            [class.has-email]="!!state.emailInput"
            role="alertdialog"
            aria-modal="true"
            [attr.aria-labelledby]="'confirm-dialog-message'"
        >
            <p id="confirm-dialog-message" class="confirm-message">{{ state.message }}</p>

            @if (state.emailInput) {
                <div class="email-field">
                    <label for="confirm-email">{{ state.emailInput.label ?? 'メールアドレス' }}</label>
                    <input
                        id="confirm-email"
                        type="email"
                        name="confirmEmail"
                        [(ngModel)]="emailValue"
                        [placeholder]="state.emailInput.placeholder ?? ''"
                        autocomplete="email"
                    />
                    @if (state.emailInput.note) {
                        <p class="email-note">{{ state.emailInput.note }}</p>
                    }
                    @if (emailError()) {
                        <p class="email-error" role="alert">{{ emailError() }}</p>
                    }
                </div>
            }

            <div class="confirm-actions">
                <button type="button" class="btn cancel-btn" (click)="cancel()">
                    {{ state.cancelLabel }}
                </button>
                <button
                    type="button"
                    class="btn confirm-btn"
                    [class.danger]="state.danger"
                    (click)="confirm()"
                >
                    {{ state.confirmLabel }}
                </button>
            </div>
        </div>
    </div>
}

<style>
    .confirm-backdrop {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(15, 23, 42, 0.45);
    }

    .confirm-dialog {
        width: min(100%, 400px);
        padding: 24px;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.18);
    }

    .confirm-dialog.has-email {
        width: min(100%, 440px);
    }

    .confirm-message {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.6;
        color: #111827;
        text-align: center;
    }

    .email-field {
        margin-top: 20px;
        text-align: left;
    }

    .email-field label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 600;
        color: #374151;
    }

    .email-field input {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
    }

    .email-note {
        margin: 6px 0 0;
        font-size: 12px;
        color: #6b7280;
        line-height: 1.5;
    }

    .email-error {
        margin: 8px 0 0;
        font-size: 13px;
        font-weight: 600;
        color: #b91c1c;
    }

    .confirm-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 24px;
    }

    .btn {
        min-width: 108px;
        min-height: 40px;
        padding: 0 16px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .cancel-btn {
        border: 1px solid #d1d5db;
        background: #fff;
        color: #374151;
    }

    .cancel-btn:hover {
        background: #f9fafb;
    }

    .confirm-btn {
        border: 1px solid #2563eb;
        background: #2563eb;
        color: #fff;
    }

    .confirm-btn:hover {
        background: #1d4ed8;
        border-color: #1d4ed8;
    }

    .confirm-btn.danger {
        border-color: #dc2626;
        background: #dc2626;
    }

    .confirm-btn.danger:hover {
        background: #b91c1c;
        border-color: #b91c1c;
    }
</style>
