<div class="main-layout" [class.employee-portal-layout]="currentUser()?.role === 'employee'">
    <app-sidebar [currentUser]="currentUser()"/>
    <div class="main-layout-content">
        <router-outlet/>
    </div>
</div>

<style>
    :host {
        display: block;
        height: 100%;
    }

    .main-layout {
        display: flex;
        height: 100%;
        overflow: hidden;
    }

    .main-layout-content {
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        padding: 32px;
        background-color: #f5f5f5;
    }

    .employee-portal-layout .main-layout-content {
        padding: 28px 32px 40px;
        background: linear-gradient(180deg, #f0fdf4 0%, #f8fafc 120px, #f1f5f9 100%);
    }

    @media (max-width: 640px) {
        .main-layout-content {
            padding: 20px 16px 32px;
        }
    }
</style>
