<h1>Employee Page</h1>

<select
    [ngModel]="selectedOfficeId()"
    (ngModelChange)="selectedOfficeId.set($event)"
>
    <option value="">すべての事業所</option>
    @for (office of officeNameById() | keyvalue; track office.key) {
        <option [value]="office.key">{{ office.value }}</option>
    }
</select>

<select
    [ngModel]="selectedStatus()"
    (ngModelChange)="selectedStatus.set($event)"
>
    <option value="">すべての在籍状態</option>
    <option value="active">在籍</option>
    <option value="retired">退職</option>
</select>

<input
    type="text"
    [ngModel]="keyword()"
    (ngModelChange)="keyword.set($event)"
    placeholder="検索キーワード"
>

<button class="add-employee-btn" routerLink="/employees/new">従業員を追加</button>

@for (employee of filteredEmployees(); track employee.id) {
    <div class="employee-card" [routerLink]="['/employees', employee.id]">
        <div class="employee-card-header">
            <p class="employee-name">{{ employee.lastName }} {{ employee.firstName }}</p>
            <span
                class="status-badge"
                [class.retired]="employee.status === 'retired'"
            >
                {{ statusLabel(employee.status) }}
            </span>
        </div>
        <p>{{ officeNameById()[employee.officeId] ?? employee.officeId }}</p>
        <p>入社日: {{ employee.joinedDate }}</p>
    </div>
}

<style>
    .employee-card {
        padding: 16px;
        margin-bottom: 12px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        cursor: pointer;
    }

    .employee-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 4px;
    }

    .employee-name {
        margin: 0;
        font-weight: 600;
    }

    .status-badge {
        flex-shrink: 0;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        background: #dcfce7;
        color: #166534;
    }

    .status-badge.retired {
        background: #f3f4f6;
        color: #4b5563;
    }
</style>
