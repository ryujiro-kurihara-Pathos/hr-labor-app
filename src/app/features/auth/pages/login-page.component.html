<div class="login-page">
    <div class="login-card">
        <h1>ログイン</h1>

        <div class="form-field">
            <label for="email">メールアドレス</label>
            <input
                id="email"
                type="email"
                name="email"
                [(ngModel)]="email"
                placeholder="example@example.com"
            />
        </div>

        <div class="form-field">
            <label for="password">パスワード</label>
            <input
                id="password"
                type="password"
                name="password"
                [(ngModel)]="password"
                placeholder="パスワード"
            />
        </div>

        @if(errorMessage) {
            <p class="error-message">{{ errorMessage }}</p>
        }

        <button type="button" class="form-btn" (click)="onLogin()" [disabled]="isLoading">
            @if(isLoading) {
                <span class="loading-content">
                    <span class="spinner"></span>
                    ログイン中
                </span>
            } @else {
                ログイン
            }
        </button>

        <p class="signup-link">
            初めて利用する場合は
            <a routerLink="/signup">新規登録</a>
        </p>
    </div>
</div>

<style>
    .login-page {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f5f6f8;
    }

    .login-card {
        width: 400px;
        padding: 32px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
        margin: 0 0 24px;
        font-size: 24px;
    }

    .form-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
    }

    label {
        font-size: 14px;
        font-weight: 600;
    }

    input {
        height: 40px;
        padding: 0 12px;
        border: 1px solid #d6d9de;
        border-radius: 8px;
        font-size: 14px;
    }

    input:focus {
        outline: none;
        border-color: #2f6fed;
    }

    .form-btn {
        width: 100%;
        height: 42px;
        margin-top: 8px;
        border: none;
        border-radius: 8px;
        background: #2f6fed;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }

    .form-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    .loading-content {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }

    .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .signup-link {
        margin-top: 16px;
        text-align: center;
        font-size: 14px;
    }

    .signup-link a {
        color: #2f6fed;
        text-decoration: none;
        font-weight: 600;
    }


    .error-message {
        color: #d93025;
        font-size: 14px;
        margin: 8px 0 16px;
    }
</style>
