<div class="signup-page">
    <div class="signup-card">
        <header class="signup-header">
            <div class="brand-mark" aria-hidden="true">社保</div>
            <div>
                <h1>新規登録</h1>
                <p class="section-note">管理者アカウントと会社情報を登録して、利用を開始します。</p>
            </div>
        </header>

        <nav class="step-nav" aria-label="登録ステップ">
            <div class="step-item" [class.active]="currentStep === 1" [class.done]="currentStep > 1">
                <span class="step-number">1</span>
                <span class="step-label">ユーザー情報</span>
            </div>
            <div class="step-connector" [class.done]="currentStep > 1"></div>
            <div class="step-item" [class.active]="currentStep === 2">
                <span class="step-number">2</span>
                <span class="step-label">会社情報</span>
            </div>
        </nav>

        @if (currentStep === 1) {
            <section class="form-section">
                <h2 class="section-title">ユーザー情報</h2>
                <p class="section-lead">ログインに使用するアカウント情報を入力してください。</p>

                <div class="form-grid">
                    <div class="form-field">
                        <label for="lastName">姓 <span class="required">必須</span></label>
                        <input
                            id="lastName"
                            type="text"
                            name="lastName"
                            [(ngModel)]="lastName"
                            placeholder="山田"
                            autocomplete="family-name"
                        />
                    </div>
                    <div class="form-field">
                        <label for="firstName">名 <span class="required">必須</span></label>
                        <input
                            id="firstName"
                            type="text"
                            name="firstName"
                            [(ngModel)]="firstName"
                            placeholder="太郎"
                            autocomplete="given-name"
                        />
                    </div>
                    <div class="form-field">
                        <label for="lastNameKana">姓（カナ）</label>
                        <input
                            id="lastNameKana"
                            type="text"
                            name="lastNameKana"
                            [(ngModel)]="lastNameKana"
                            placeholder="ヤマダ"
                        />
                    </div>
                    <div class="form-field">
                        <label for="firstNameKana">名（カナ）</label>
                        <input
                            id="firstNameKana"
                            type="text"
                            name="firstNameKana"
                            [(ngModel)]="firstNameKana"
                            placeholder="タロウ"
                        />
                    </div>
                    <div class="form-field form-field-wide">
                        <label for="email">メールアドレス <span class="required">必須</span></label>
                        <input
                            id="email"
                            type="email"
                            name="email"
                            [(ngModel)]="email"
                            placeholder="example@company.com"
                            autocomplete="email"
                        />
                    </div>
                    <div class="form-field">
                        <label for="password">パスワード <span class="required">必須</span></label>
                        <input
                            id="password"
                            type="password"
                            name="password"
                            [(ngModel)]="password"
                            placeholder="6文字以上"
                            autocomplete="new-password"
                        />
                    </div>
                    <div class="form-field">
                        <label for="confirmPassword">パスワード（確認） <span class="required">必須</span></label>
                        <input
                            id="confirmPassword"
                            type="password"
                            name="confirmPassword"
                            [(ngModel)]="confirmPassword"
                            placeholder="もう一度入力"
                            autocomplete="new-password"
                        />
                    </div>
                </div>

                @if (errorMessage) {
                    <p class="error-message" role="alert">{{ errorMessage }}</p>
                }

                <button type="button" class="form-btn" (click)="goToCompanyForm()">
                    次へ：会社情報
                </button>

                <p class="footer-link">
                    すでにアカウントをお持ちの方は
                    <a routerLink="/login">ログイン</a>
                </p>
            </section>
        }

        @if (currentStep === 2) {
            <section class="form-section">
                <h2 class="section-title">会社情報</h2>
                <p class="section-lead">管理する会社の基本情報を入力してください。</p>

                <div class="form-stack">
                    <div class="form-field">
                        <label for="companyName">会社名 <span class="required">必須</span></label>
                        <input
                            id="companyName"
                            type="text"
                            name="companyName"
                            [(ngModel)]="companyName"
                            placeholder="株式会社サンプル"
                            autocomplete="organization"
                        />
                    </div>
                    <div class="form-field">
                        <label for="representativeName">代表者名 <span class="required">必須</span></label>
                        <input
                            id="representativeName"
                            type="text"
                            name="representativeName"
                            [(ngModel)]="representativeName"
                            placeholder="山田 太郎"
                        />
                    </div>
                    <div class="form-field">
                        <label for="companyAddress">会社所在地 <span class="required">必須</span></label>
                        <input
                            id="companyAddress"
                            type="text"
                            name="companyAddress"
                            [(ngModel)]="companyAddress"
                            placeholder="東京都千代田区..."
                            autocomplete="street-address"
                        />
                    </div>
                </div>

                @if (errorMessage) {
                    <p class="error-message" role="alert">{{ errorMessage }}</p>
                }

                <div class="button-row">
                    <button type="button" class="form-btn sub-button" (click)="backToUserForm()">
                        戻る
                    </button>
                    <button type="button" class="form-btn" (click)="onSignup()" [disabled]="isLoading">
                        @if (isLoading) {
                            <span class="loading-content">
                                <span class="spinner"></span>
                                登録中
                            </span>
                        } @else {
                            登録する
                        }
                    </button>
                </div>
            </section>
        }
    </div>
</div>

<style>
    .signup-page {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f5f6f8;
        padding: 24px 16px;
    }

    .signup-card {
        width: min(560px, 100%);
        padding: 32px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .signup-header {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 24px;
    }

    .brand-mark {
        flex-shrink: 0;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: linear-gradient(135deg, #2f6fed, #1d4ed8);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
    }

    h1 {
        margin: 0 0 6px;
        font-size: 24px;
        line-height: 1.3;
    }

    .section-note {
        margin: 0;
        color: #6b7280;
        font-size: 13px;
        line-height: 1.5;
    }

    .step-nav {
        display: flex;
        align-items: center;
        gap: 0;
        margin-bottom: 28px;
        padding: 12px 16px;
        border-radius: 10px;
        background: #f8fafc;
    }

    .step-item {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 0;
        color: #9ca3af;
    }

    .step-item.active {
        color: #1f2937;
    }

    .step-item.done {
        color: #2f6fed;
    }

    .step-number {
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: #e5e7eb;
        color: #6b7280;
        font-size: 13px;
        font-weight: 700;
    }

    .step-item.active .step-number {
        background: #2f6fed;
        color: #fff;
    }

    .step-item.done .step-number {
        background: #dbeafe;
        color: #2f6fed;
    }

    .step-label {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .step-connector {
        flex-shrink: 0;
        width: 32px;
        height: 2px;
        margin: 0 8px;
        background: #e5e7eb;
        border-radius: 1px;
    }

    .step-connector.done {
        background: #93c5fd;
    }

    .form-section {
        display: flex;
        flex-direction: column;
    }

    .section-title {
        margin: 0 0 6px;
        font-size: 18px;
        font-weight: 700;
    }

    .section-lead {
        margin: 0 0 20px;
        color: #6b7280;
        font-size: 13px;
        line-height: 1.5;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 4px;
    }

    .form-stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-bottom: 4px;
    }

    .form-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .form-field-wide {
        grid-column: 1 / -1;
    }

    label {
        font-size: 14px;
        font-weight: 600;
        color: #374151;
    }

    .required {
        margin-left: 4px;
        color: #dc2626;
        font-size: 12px;
        font-weight: 600;
    }

    input {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 1px solid #d6d9de;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
        background: #fff;
    }

    input:focus {
        outline: none;
        border-color: #2f6fed;
        box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.12);
    }

    .error-message {
        margin: 12px 0 0;
        padding: 10px 12px;
        border-radius: 8px;
        background: #fef2f2;
        color: #b91c1c;
        font-size: 14px;
        line-height: 1.5;
    }

    .form-btn {
        height: 42px;
        margin-top: 20px;
        border: none;
        border-radius: 8px;
        background: #2f6fed;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }

    .form-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    .button-row {
        display: grid;
        grid-template-columns: 1fr 1.4fr;
        gap: 12px;
    }

    .button-row .form-btn {
        width: 100%;
        margin-top: 20px;
    }

    .sub-button {
        background: #f3f4f6;
        color: #374151;
        border: 1px solid #d6d9de;
    }

    .sub-button:hover:not(:disabled) {
        background: #e5e7eb;
    }

    .form-btn:not(.sub-button):hover:not(:disabled) {
        background: #2563eb;
    }

    .loading-content {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }

    .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .footer-link {
        margin: 20px 0 0;
        text-align: center;
        font-size: 14px;
        color: #6b7280;
    }

    .footer-link a {
        color: #2f6fed;
        text-decoration: none;
        font-weight: 600;
    }

    .footer-link a:hover {
        text-decoration: underline;
    }

    @media (max-width: 520px) {
        .signup-card {
            padding: 24px 20px;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .step-label {
            font-size: 12px;
        }

        .step-connector {
            width: 16px;
            margin: 0 4px;
        }
    }
</style>
