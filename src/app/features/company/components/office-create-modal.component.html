<div class="modal-backdrop" (click)="onBackdropClick($event)">
    <div class="modal-card" role="dialog" aria-labelledby="office-modal-title">
        <h1 id="office-modal-title">事業所を登録</h1>
        <p class="modal-note">登録後、詳細画面で電話番号や社会保険番号などを編集できます。</p>

        <div class="form-field">
            <label for="office-name">事業所名 <span class="required">必須</span></label>
            <input
                id="office-name"
                type="text"
                name="name"
                [(ngModel)]="name"
                placeholder="例：本社"
                required
            />
        </div>

        <div class="form-field">
            <label for="office-prefecture">都道府県 <span class="required">必須</span></label>
            <select id="office-prefecture" name="prefecture" [(ngModel)]="prefecture" required>
                <option value="">選択してください</option>
                @for (item of prefectures; track item) {
                    <option [value]="item">{{ item }}</option>
                }
            </select>
        </div>

        <div class="form-field">
            <label for="office-city">市区町村 <span class="optional">任意</span></label>
            <input
                id="office-city"
                type="text"
                name="city"
                [(ngModel)]="city"
                placeholder="例：千代田区"
            />
        </div>

        <div class="form-field">
            <label for="office-street-address">町名・番地 <span class="optional">任意</span></label>
            <input
                id="office-street-address"
                type="text"
                name="streetAddress"
                [(ngModel)]="streetAddress"
                placeholder="例：永田町1-7-1"
            />
        </div>

        <div class="form-field">
            <label for="office-building-name">建物名 <span class="optional">任意</span></label>
            <input
                id="office-building-name"
                type="text"
                name="buildingName"
                [(ngModel)]="buildingName"
                placeholder="例：永田町ビル101号室"
            />
        </div>

        <div class="form-field">
            <div class="label-row">
                <label>健康保険の種類</label>
                <app-field-help-tooltip
                    title="健康保険"
                    [lines]="healthInsuranceHelpLines"
                />
            </div>
            <p class="fixed-value">協会けんぽ</p>
        </div>

        @if (displayErrorMessage()) {
            <p class="error-message" role="alert">{{ displayErrorMessage() }}</p>
        }

        <div class="button-area">
            <button type="button" class="form-btn sub-button" (click)="onCancel()" [disabled]="isLoading()">
                キャンセル
            </button>
            <button type="button" class="form-btn" (click)="onSubmit()" [disabled]="isLoading()">
                @if (isLoading()) {
                    <span class="loading-content">
                        <span class="spinner"></span>
                        登録中
                    </span>
                } @else {
                    登録する
                }
            </button>
        </div>
    </div>
</div>

<style>
    .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.45);
    }

    .modal-card {
        width: 100%;
        max-width: 480px;
        padding: 28px 32px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        overflow: visible;
    }

    h1 {
        margin: 0 0 8px;
        font-size: 22px;
    }

    .modal-note {
        margin: 0 0 20px;
        color: #6b7280;
        font-size: 13px;
        line-height: 1.5;
    }

    .form-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
    }

    .label-row {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    label {
        font-size: 14px;
        font-weight: 600;
    }

    .required {
        margin-left: 4px;
        padding: 1px 6px;
        border-radius: 4px;
        background: #fee2e2;
        color: #b91c1c;
        font-size: 10px;
        font-weight: 700;
        vertical-align: middle;
    }

    .optional {
        margin-left: 4px;
        padding: 1px 6px;
        border-radius: 4px;
        background: #f3f4f6;
        color: #6b7280;
        font-size: 10px;
        font-weight: 600;
        vertical-align: middle;
    }

    .fixed-value {
        margin: 0;
        padding: 10px 12px;
        border-radius: 8px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        font-size: 14px;
        font-weight: 600;
        color: #1e293b;
    }

    input,
    select {
        height: 40px;
        padding: 0 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        background: #fff;
    }

    select {
        cursor: pointer;
    }

    .error-message {
        margin: 0 0 12px;
        color: #dc2626;
        font-size: 14px;
    }

    .button-area {
        display: flex;
        gap: 12px;
        margin-top: 8px;
    }

    .form-btn {
        flex: 1;
        height: 42px;
        border: none;
        border-radius: 8px;
        background-color: #2563eb;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }

    .form-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    .sub-button {
        background-color: #e5e7eb;
        color: #333;
    }

    .loading-content {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }

    .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }
</style>
