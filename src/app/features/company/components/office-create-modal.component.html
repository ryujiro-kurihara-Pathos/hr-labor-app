<div class="modal-backdrop" (click)="onBackdropClick($event)">
    <div class="modal-card" role="dialog" aria-labelledby="office-modal-title">
        <h1 id="office-modal-title">事業所登録</h1>

        <div class="form-field">
            <label for="office-name">事業所名</label>
            <input
                id="office-name"
                type="text"
                name="name"
                [(ngModel)]="name"
                placeholder="例：本社"
            />
        </div>

        <div class="form-field">
            <label for="office-address">所在地</label>
            <input
                id="office-address"
                type="text"
                name="address"
                [(ngModel)]="address"
                placeholder="例：東京都千代田区..."
            />
        </div>

        <div class="form-field">
            <label for="health-insurance-type">健康保険の種類</label>
            <select
                id="health-insurance-type"
                name="healthInsuranceType"
                [(ngModel)]="healthInsuranceType"
            >
                <option value="kyokai">協会けんぽ</option>
                <option value="union">組合健保</option>
            </select>
        </div>

        @if(errorMessage()) {
            <p class="error-message">{{ errorMessage() }}</p>
        }

        <div class="button-area">
            <button type="button" class="form-btn sub-button" (click)="onCancel()" [disabled]="isLoading()">
                キャンセル
            </button>
            <button type="button" class="form-btn" (click)="onSubmit()" [disabled]="isLoading()">
                @if(isLoading()) {
                    <span class="loading-content">
                        <span class="spinner"></span>
                        登録中
                    </span>
                } @else {
                    登録する
                }
            </button>
        </div>
    </div>
</div>

<style>
    .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.45);
    }

    .modal-card {
        width: 100%;
        max-width: 420px;
        padding: 28px 32px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    h1 {
        margin: 0 0 20px;
        font-size: 22px;
    }

    .form-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
    }

    label {
        font-size: 14px;
        font-weight: 600;
    }

    input,
    select {
        height: 40px;
        padding: 0 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
    }

    select {
        cursor: pointer;
        background: #fff;
    }

    .error-message {
        margin: 0 0 12px;
        color: #dc2626;
        font-size: 14px;
    }

    .button-area {
        display: flex;
        gap: 12px;
        margin-top: 8px;
    }

    .form-btn {
        flex: 1;
        height: 42px;
        border: none;
        border-radius: 8px;
        background-color: #2f6fed;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }

    .form-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    .sub-button {
        background-color: #e5e7eb;
        color: #333;
    }

    .loading-content {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }

    .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }
</style>
